    // Cached DOM Reference Element map for performance optimization
    const DOM = {
      dateFilter: document.getElementById("dateFilter"),

    // =========================================================================
    // DATA INITIALIZATION & EVENT LISTENERS
    // =========================================================================

    // Loads CSV data, strips any UTF-8 BOM characters from column headers, and assigns the clean dataset to window.gameData
    d3.csv("02_weekFull.csv", raw => {
      // Clean Byte Order Mark (BOM) artifact from CSV headers if present
      const clean = {};
      Object.keys(raw).forEach(key => {
        const normalizedKey = key.replace(/^\uFEFF/, "");
        clean[normalizedKey] = raw[key];
      });
      return clean;
    }).then(data => {
      window.gameData = data;

      // Initialize Day/Date Slicer Options
      const initialDate = getFirstAvailableDate(window.gameData);
      updateDateSlicer(window.gameData, initialDate);

      // Perform initial adaptive cascading setup and render
      updateCascadingFilters();
      applyFilters();

      // Set up hierarchical cascading event listeners
      DOM.dateFilter.addEventListener("change", () => {
        updateCascadingFilters(1);
        applyFilters();
      });

      DOM.timeFilter.addEventListener("change", () => {
        updateCascadingFilters(2); // Cascade down from Kickoff Time
        applyFilters();
      });

      DOM.rankedFilter.addEventListener("change", () => {
        updateCascadingFilters(3); // Cascade down from Ranked Teams
        applyFilters();
      });
    });

    // =========================================================================
    // CASCADING SLICER ARCHITECTURE
    // =========================================================================

    // Extract and sort distinct dates chronologically
    function getFirstAvailableDate(allData) {
      const uniqueDates = Array.from(new Set(allData.map(d => d.Date)))
        .filter(Boolean)
        .sort((a, b) => new Date(a) - new Date(b));
      return uniqueDates[0] || null;
    }

    // Populate the primary Date selection dropdown
    function updateDateSlicer(allData, selectedDate) {
      const uniqueDates = Array.from(new Set(allData.map(d => d.Date)))
        .filter(Boolean)
        .sort((a, b) => new Date(a) - new Date(b));

      DOM.dateFilter.innerHTML = "";
      uniqueDates.forEach(date => {
        const opt = document.createElement("option");
        opt.value = date;
        opt.textContent = date;
        DOM.dateFilter.appendChild(opt);
      });

      if (selectedDate && uniqueDates.includes(selectedDate)) {
        DOM.dateFilter.value = selectedDate;
      } else if (uniqueDates.length > 0) {
        DOM.dateFilter.value = uniqueDates[0];
      }
    }

    // Manage top-down hierarchical cascading option dependencies
    // Order: Date (1) -> Time (2) -> Ranked (3) -> Conference (4) -> Media Provider (5)
    // @param {number} startLevel - Specifies level where modification was triggered
    function updateCascadingFilters(startLevel = 1) {
      const selectedDate = DOM.dateFilter.value;
      
      // Filter base data by Day/Date
      let subset = window.gameData.filter(d => d.Date === selectedDate);

      // Update Kickoff Time Slicer (adaptive to Date selection)
      if (startLevel <= 1) {
        const currentTime = DOM.timeFilter.value;
        updateTimeSlicer(subset, currentTime);
      }
      
      // Filter subset by selected Kickoff Time
      const selectedTime = DOM.timeFilter.value;
      if (selectedTime && selectedTime !== "All") {
        subset = subset.filter(d => d.Start_Time === selectedTime);
      }

      // Update Ranked Teams Slicer (adaptive to Date + Kickoff Time)
      if (startLevel <= 2) {
        const currentRanked = DOM.rankedFilter.value;
        updateRankedSlicer(subset, currentRanked);
      }

      // Filter subset by selected Ranked Status
      const selectedRanked = DOM.rankedFilter.value;
      if (selectedRanked && selectedRanked === "Y") {
        subset = subset.filter(d => d.Top_25 === "Y");
      }

      // Update Conference Slicer (adaptive to Date + Time + Ranked)
      const allConfCheckbox = document.getElementById("conf_all");
      const wasAllConfChecked = allConfCheckbox ? allConfCheckbox.checked : true;

      let checkedConferences = [];
      if (!wasAllConfChecked) {
        checkedConferences = Array.from(
          document.querySelectorAll("#conferenceFilter .conf-checkbox:checked")
        ).map(cb => cb.value);
      }

      updateConferenceSlicer(subset, checkedConferences);

      // Filter subset by selected Conferences
      const activeConfBoxes = Array.from(
        document.querySelectorAll("#conferenceFilter .conf-checkbox:checked")
      ).map(cb => cb.value);

      if (activeConfBoxes.length > 0) {
        subset = subset.filter(d => 
          activeConfBoxes.includes(d.Visitor_Conference) || activeConfBoxes.includes(d.Home_Conference)
        );
      }

      // Update Media Provider Slicer (adaptive to Date + Time + Ranked + Conference)
      const allNetCheckbox = document.getElementById("net_all");
      const wasAllNetChecked = allNetCheckbox ? allNetCheckbox.checked : true;

      let checkedNetworks = [];
      if (!wasAllNetChecked) {
        checkedNetworks = Array.from(
          document.querySelectorAll("#networkFilter .network-checkbox:checked")
        ).map(cb => cb.value);
      }

      updateNetworkSlicer(subset, checkedNetworks);
    }

    // Rebuild Kickoff Time dropdown dynamically based on available games
    function updateTimeSlicer(filteredData, selectedTime) {
      const uniqueTimes = Array.from(new Set(filteredData.map(d => d.Start_Time)))
        .filter(Boolean)
        .sort((a, b) => timeToMinutes(a) - timeToMinutes(b));

      DOM.timeFilter.innerHTML = '<option value="All">All Times</option>';

      uniqueTimes.forEach(time => {
        const opt = document.createElement("option");
        opt.value = time;
        opt.textContent = time;
        DOM.timeFilter.appendChild(opt);
      });

      DOM.timeFilter.value = (selectedTime && (uniqueTimes.includes(selectedTime) || selectedTime === "All"))
        ? selectedTime 
        : "All";
    }

    // Update Ranked Matches dropdown based on filtered availability
    function updateRankedSlicer(filteredData, selectedRanked) {
      DOM.rankedFilter.innerHTML = `
        <option value="All">All Games</option>
        <option value="Y">AP Top 25</option>
      `;

      DOM.rankedFilter.value = (selectedRanked === "Y" || selectedRanked === "All") 
        ? selectedRanked 
        : "All";
    }

// Dynamically construct individual conference checkboxes sorted by preferred priority
// Defaults to "All Conferences" checked on initial load
function updateConferenceSlicer(filteredData, selectedConferences = []) {
  // Aggregate conferences from both Visitor_Conference and Home_Conference
  const extractedConfs = new Set();
  filteredData.forEach(d => {
    if (d.Visitor_Conference) extractedConfs.add(d.Visitor_Conference.trim());
    if (d.Home_Conference) extractedConfs.add(d.Home_Conference.trim());
  });

  const uniqueConfs = Array.from(extractedConfs).filter(Boolean);

  // Separate into preferred order and remaining alphabetical order
  const priorityConfs = PREFERRED_CONF_ORDER.filter(conf => uniqueConfs.includes(conf));
  const remainingConfs = uniqueConfs
    .filter(conf => !PREFERRED_CONF_ORDER.includes(conf))
    .sort((a, b) => a.localeCompare(b));

  const orderedConfs = [...priorityConfs, ...remainingConfs];

  DOM.conferenceFilter.innerHTML = "";

  // DEFAULT TO TRUE: If no explicitly passed list, default to selecting all
  const hasSelectionPassed = Array.isArray(selectedConferences) && selectedConferences.length > 0;
  const isAllChecked = !hasSelectionPassed || orderedConfs.every(conf => selectedConferences.includes(conf));

  // Master Toggle Element
  const allDiv = document.createElement("div");
  allDiv.className = "form-check border-bottom pb-1 mb-2";
  allDiv.innerHTML = `
    <input class="form-check-input" type="checkbox" id="conf_all" ${isAllChecked ? 'checked' : ''}>
    <label class="form-check-label fw-bold" for="conf_all">All Conferences</label>
  `;
  DOM.conferenceFilter.appendChild(allDiv);

  // Individual Checkbox Nodes
  orderedConfs.forEach((conf, idx) => {
    const isChecked = isAllChecked || selectedConferences.includes(conf);
    const div = document.createElement("div");
    div.className = "form-check";
    div.innerHTML = `
      <input class="form-check-input conf-checkbox" type="checkbox" value="${conf}" id="conf_${idx}" ${isChecked ? 'checked' : ''}>
      <label class="form-check-label" for="conf_${idx}">${conf}</label>
    `;
    DOM.conferenceFilter.appendChild(div);
  });

  // Event Listener Setup
  const allCheckbox = document.getElementById("conf_all");
  const itemCheckboxes = DOM.conferenceFilter.querySelectorAll(".conf-checkbox");

  allCheckbox.addEventListener("change", (e) => {
    itemCheckboxes.forEach(cb => cb.checked = e.target.checked);
    cascadeFromConference();
  });

  itemCheckboxes.forEach(cb => {
    cb.addEventListener("change", () => {
      allCheckbox.checked = Array.from(itemCheckboxes).every(item => item.checked);
      cascadeFromConference();
    });
  });
}

// Helper function to handle cascading downstream from Conference changes without re-rendering Conference control HTML itself
function cascadeFromConference() {
  const selectedDate = DOM.dateFilter.value;
  let subset = window.gameData.filter(d => d.Date === selectedDate);

  const selectedTime = DOM.timeFilter.value;
  if (selectedTime && selectedTime !== "All") {
    subset = subset.filter(d => d.Start_Time === selectedTime);
  }

  const selectedRanked = DOM.rankedFilter.value;
  if (selectedRanked && selectedRanked === "Y") {
    subset = subset.filter(d => d.Top_25 === "Y");
  }

  // Filter subset by active checked conferences
  const activeConfBoxes = Array.from(
    document.querySelectorAll("#conferenceFilter .conf-checkbox:checked")
  ).map(cb => cb.value);

  if (activeConfBoxes.length > 0) {
    subset = subset.filter(d => 
      activeConfBoxes.includes(d.Visitor_Conference) || activeConfBoxes.includes(d.Home_Conference)
    );
  }

  // Update downstream Media Provider slicer options & render charts
  const allNetCheckbox = document.getElementById("net_all");
  const wasAllNetChecked = allNetCheckbox ? allNetCheckbox.checked : true;

  let checkedNetworks = [];
  if (!wasAllNetChecked) {
    checkedNetworks = Array.from(
      document.querySelectorAll("#networkFilter .network-checkbox:checked")
    ).map(cb => cb.value);
  }

  updateNetworkSlicer(subset, checkedNetworks);
  applyFilters();
}

    //Dynamically construct individual network checkboxes and handle master selection toggling
    function updateNetworkSlicer(filteredData, selectedNetworks) {
      const uniqueNetworks = Array.from(new Set(filteredData.map(d => d.TV_Network)))
        .filter(Boolean)
        .sort();
        
      DOM.networkFilter.innerHTML = "";

      const isAllChecked = selectedNetworks.length === 0 || uniqueNetworks.every(net => selectedNetworks.includes(net));

      // Master Toggle Element
      const allDiv = document.createElement("div");
      allDiv.className = "form-check border-bottom pb-1 mb-2";
      allDiv.innerHTML = `
        <input class="form-check-input" type="checkbox" id="net_all" ${isAllChecked ? 'checked' : ''}>
        <label class="form-check-label fw-bold" for="net_all">All Providers</label>
      `;
      DOM.networkFilter.appendChild(allDiv);

      // Individual Checkbox Nodes
      uniqueNetworks.forEach((net, idx) => {
        const isChecked = isAllChecked || selectedNetworks.includes(net);
        const div = document.createElement("div");
        div.className = "form-check";
        div.innerHTML = `
          <input class="form-check-input network-checkbox" type="checkbox" value="${net}" id="net_${idx}" ${isChecked ? 'checked' : ''}>
          <label class="form-check-label" for="net_${idx}">${net}</label>
        `;
        DOM.networkFilter.appendChild(div);
      });

      // Master Checkbox Event Attachment
      const allCheckbox = document.getElementById("net_all");
      const itemCheckboxes = DOM.networkFilter.querySelectorAll(".network-checkbox");

      allCheckbox.addEventListener("change", (e) => {
        itemCheckboxes.forEach(cb => cb.checked = e.target.checked);
        applyFilters();
      });

      // Child Checkbox Event Attachment
      itemCheckboxes.forEach(cb => {
        cb.addEventListener("change", () => {
          allCheckbox.checked = Array.from(itemCheckboxes).every(item => item.checked);
          applyFilters();
        });
      });
    }

    // Evaluate all active control values and execute chart re-rendering
    function applyFilters() {
  const selectedDate = DOM.dateFilter.value;
  const selectedTime = DOM.timeFilter.value;
  const selectedRanked = DOM.rankedFilter.value;

  const allConfChecked = document.getElementById("conf_all")?.checked;
  const checkedConferences = Array.from(
    document.querySelectorAll("#conferenceFilter .conf-checkbox:checked")
  ).map(cb => cb.value);

  const checkedNetworks = Array.from(
    document.querySelectorAll("#networkFilter .network-checkbox:checked")
  ).map(cb => cb.value);

  let filtered = window.gameData.filter(d => d.Date === selectedDate);

  if (selectedTime && selectedTime !== "All") {
    filtered = filtered.filter(d => d.Start_Time === selectedTime);
  }

  if (selectedRanked && selectedRanked === "Y") {
    filtered = filtered.filter(d => d.Top_25 === "Y");
  }

  // Filter by conference ONLY if "All Conferences" is unchecked and specific ones are selected
  if (!allConfChecked) {
    filtered = filtered.filter(d => 
      checkedConferences.includes(d.Visitor_Conference?.trim()) || 
      checkedConferences.includes(d.Home_Conference?.trim())
    );
  }

  filtered = filtered.filter(d => checkedNetworks.includes(d.TV_Network));

  const primaryData = filtered.filter(d => !DIGITAL_NETWORKS.includes(d.TV_Network));
  const digitalData = filtered.filter(d => DIGITAL_NETWORKS.includes(d.TV_Network));

  renderChart('barChart', primaryData, false);
  renderChart('digitalChart', digitalData, true);
}

    // =========================================================================
    // UTILITY HELPER FUNCTIONS
    // =========================================================================

    // Resolve the primary brand hex color for the home team by searching TEAM_COLORS for exact key matches
    // @param {string} matchup - Full matchup string (e.g., "#1 Ohio State at Penn State (4-0)")
    // @returns {string} Hex color string or default gray fallback (#D3D3D3)
    function getHomeTeamColor(matchup) {
      if (!matchup) return '#D3D3D3';

      // Split text string by " at " or " vs " / " vs. " (case-insensitive) to isolate the home team segment
      const parts = matchup.split(/\s+(?:at|vs\.?)\s+/i);
      if (parts.length < 2) return '#D3D3D3';

      const homeTeamRaw = parts[parts.length - 1].trim();

      // Direct exact lookup on the raw home team string
      if (Object.prototype.hasOwnProperty.call(TEAM_COLORS, homeTeamRaw)) {
        return TEAM_COLORS[homeTeamRaw];
      }

      // Strip rank prefixes (e.g. "No. 5", "#12") and parenthetical strings (e.g. "(4-0)", "(OT)")
      let homeTeamClean = homeTeamRaw
        .replace(/^(?:No\.\s*\d+|#\d+)\s+/i, '')
        .replace(/\s*\([^)]*\)/g, '')
        .trim();

      // Direct exact lookup on the cleaned home team name
      if (Object.prototype.hasOwnProperty.call(TEAM_COLORS, homeTeamClean)) {
        return TEAM_COLORS[homeTeamClean];
      }

      // Default fallback color (light gray) if no exact key matches are found in TEAM_COLORS
      return '#D3D3D3';
    }

    // Convert standard AM/PM time strings into absolute minute integers from midnight
    function timeToMinutes(t) {
      if (!t) return 0;
      const [time, ampm] = t.split(' ');
      let [h, m] = time.split(':').map(Number);
      if (ampm === 'PM' && h !== 12) h += 12;
      if (ampm === 'AM' && h === 12) h = 0;
      return h * 60 + m;
    }

    // Allocates overlapping games on the same network to stacked sub-rows
    function resolveOverlapSubRows(games) {
      games.sort((a, b) => timeToMinutes(a.Start_Time) - timeToMinutes(b.Start_Time));

      const subRowEndTimes = [];
      const assignedGames = [];

      games.forEach(game => {
        const start = timeToMinutes(game.Start_Time);
        const end = timeToMinutes(game.End_Time);
        const effectiveEnd = end >= start ? end : end + 1440;

        let rowIndex = -1;
        for (let i = 0; i < subRowEndTimes.length; i++) {
          if (subRowEndTimes[i] <= start) {
            rowIndex = i;
            break;
          }
        }

        if (rowIndex === -1) {
          subRowEndTimes.push(effectiveEnd);
          rowIndex = subRowEndTimes.length - 1;
        } else {
          subRowEndTimes[rowIndex] = effectiveEnd;
        }

        assignedGames.push({
          ...game,
          subRowIndex: rowIndex
        });
      });

      return { assignedGames, totalSubRows: subRowEndTimes.length };
    }

    // =========================================================================
    // CHART RENDER ENGINE (Plotly.js)
    // =========================================================================

    function renderChart(targetId, data, isDigital = false) {
  const container = document.getElementById(targetId);

  // Empty / No Data Fallback
  if (!data || data.length === 0) {
    container.style.height = '120px';
    Plotly.newPlot(targetId, [], {
      paper_bgcolor: 'rgba(0,0,0,0)',
      plot_bgcolor: 'rgba(0,0,0,0)',
      title: {
        text: isDigital ? 'No streaming games matching selections.' : 'No network games matching selections.',
        font: { size: 14, color: '#f3e5ab', family: 'Segoe UI, Arial, sans-serif' }
      },
      xaxis: { visible: false },
      yaxis: { visible: false },
      showlegend: false
    }, { responsive: true, displayModeBar: false });
    return;
  }

  const grouped = d3.group(data, d => d.TV_Network);
  const traces = [];
  const yTicks = [];
  const yTickLabels = [];

  grouped.forEach((games, network) => {
    const { assignedGames, totalSubRows } = resolveOverlapSubRows(games);

    for (let i = 0; i < totalSubRows; i++) {
      const rowKey = `${network}_row_${i}`;
      yTicks.push(rowKey);
      yTickLabels.push(network);
    }

    assignedGames.forEach(game => {
      const start = timeToMinutes(game.Start_Time);
      const end = timeToMinutes(game.End_Time);
      const duration = end >= start ? (end - start) : (end + 1440 - start);
      const teamHexColor = getHomeTeamColor(game.Matchup);

      const internalRowKey = `${network}_row_${game.subRowIndex}`;

      traces.push({
        type: 'bar',
        orientation: 'h',
        y: [internalRowKey],
        x: [duration],
        base: [start],
        name: game.Matchup,
        marker: { 
          color: teamHexColor,
          // Thin gold border frame around team blocks to pop against dark background
          line: { color: '#d4af37', width: 1.5 }
        },
        text: [game.Matchup],
        textposition: 'inside',
        insidetextanchor: 'middle',
        insidetextfont: { 
          family: 'Segoe UI, Arial, sans-serif',
          color: '#ffffff'
        },
        hovertemplate:
          '<b>%{text}</b><br>' +
          'Network: ' + network + '<br>' +
          'Kickoff: %{customdata[0]}<br>' +
          'End: %{customdata[1]}<extra></extra>',
        customdata: [[game.Start_Time, game.End_Time]]
      });
    });
  });

  // Strict Row Height Math
  const ROW_HEIGHT = 30; // Exact target height per bar/row
  const TOP_AXIS_PADDING = 80; // Buffer space for top time axis and margins
  const totalRows = yTicks.length;
  
  // Explicit plot height
  const calculatedPlotHeight = (totalRows * ROW_HEIGHT) + TOP_AXIS_PADDING;

  // Set height directly on the DOM wrapper element
  container.style.height = `${calculatedPlotHeight}px`;

  const layout = {
    height: calculatedPlotHeight, // Lock Plotly canvas height strictly to JS calculation
    paper_bgcolor: 'rgba(0,0,0,0)', // Transparent canvas for dark card background
    plot_bgcolor: 'rgba(0,0,0,0)',  // Transparent plot background
    barmode: 'stack',
    bargap: 0.15,                 
    autosize: true,
    margin: {
      l: 100,
      r: 20,
      t: 60,
      b: 10
    },
    dragmode: false,
    xaxis: {
      fixedrange: true,
      side: 'top',
      type: 'linear',
      range: [660, 1500],
      tickmode: 'array',
      tickvals: SHARED_X_AXIS_VALS,
      ticktext: SHARED_X_AXIS_TEXT,
      tickangle: -30,
      tickfont: { family: 'Segoe UI, Arial, sans-serif', size: 10, color: '#f3e5ab' },
      ticks: 'outside',
      ticklen: 10,
      tickcolor: 'rgba(0,0,0,0)',
      showgrid: true,
      gridcolor: 'rgba(212, 175, 55, 0.15)', // Faint gold vertical time gridlines
      autorange: false,
      automargin: false
    },
    yaxis: {
      fixedrange: true,
      ticksuffix: '   ',
      autorange: 'reversed',
      ticks: 'outside',
      ticklen: 8,
      tickcolor: 'rgba(0,0,0,0)',
      tickmode: 'array',
      tickvals: yTicks,
      ticktext: yTickLabels,
      tickfont: { family: 'Segoe UI, Arial, sans-serif', color: '#f3e5ab' },
      automargin: true
    },
    showlegend: false
  };

  const config = { responsive: true, displayModeBar: false };

  Plotly.newPlot(targetId, traces, layout, config);
}

    // Debounced window resize handler for fluid Plotly redrawing
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        Plotly.Plots.resize('barChart');
        Plotly.Plots.resize('digitalChart');
      }, 100);
    });
  </script>
</body>
