<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Football Broadcast Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .filter-panel {
      background-color: #fff;
      border-radius: 8px;
      padding: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .chart-container {
      background-color: #fff;
      border-radius: 8px;
      padding: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      height: 70vh;
    }
  </style>
</head>
<body>
  <div class="container-fluid mt-4">
    <div class="row mb-3">
      <div class="col-md-3 filter-panel">
        <h5 class="mb-3">Selections</h5>
        <div class="mb-3">
          <label for="dateFilter" class="form-label">Date</label>
          <select id="dateFilter" class="form-select"></select>
        </div>
        <div class="mb-3">
          <label for="networkFilter" class="form-label">TV Provider</label>
          <select id="networkFilter" class="form-select" multiple></select>
        </div>
        <div class="mb-3">
          <label for="timeFilter" class="form-label">Kickoff Time (Eastern)</label>
          <select id="timeFilter" class="form-select"></select>
        </div>
      </div>

      <div class="col-md-9">
        <div class="chart-container">
          <h5 class="mb-3">College Football Guide</h5>
          <div id="barChart"></div>
        </div>
      </div>
    </div>
  </div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<script>
  
  d3.csv("01_weekFull.csv").then(data => {
    
  function applyFilters() {
  const selectedDate = document.getElementById("dateFilter").value;
  const selectedNetworks = Array.from(document.getElementById("networkFilter").selectedOptions).map(o => o.value);
  const selectedTime = document.getElementById("timeFilter").value;

  // 1. Start with full dataset
  let filtered = window.gameData;

  // 2. Apply Date filter
  if (selectedDate) {
    filtered = filtered.filter(d => d.Date === selectedDate);
  }

  // 3. Apply TV Network filter
  if (selectedNetworks.length > 0) {
    filtered = filtered.filter(d => selectedNetworks.includes(d.TV_Network));
  }

  // 4. Apply Kickoff Time filter
  if (selectedTime) {
    filtered = filtered.filter(d => d.Start_Time === selectedTime);
  }

  // 5. Update slicers based on filtered dataset
  updateDateSlicer(filtered);
  updateNetworkSlicer(filtered);
  updateTimeSlicer(filtered);

  // (Chart update will come later)
}
      
  function updateDateSlicer(filteredData) {
  const uniqueDates = Array.from(new Set(filteredData.map(d => d.Date)))
    .sort((a, b) => new Date(a) - new Date(b));

  const dateSelect = document.getElementById("dateFilter");
  const currentValue = dateSelect.value;

  dateSelect.innerHTML = "";

  uniqueDates.forEach(date => {
    const opt = document.createElement("option");
    opt.value = date;
    opt.textContent = date;
    dateSelect.appendChild(opt);
  });

  if (uniqueDates.includes(currentValue)) {
    dateSelect.value = currentValue;
  }
}

function updateNetworkSlicer(filteredData) {
  const uniqueNetworks = Array.from(new Set(filteredData.map(d => d.TV_Network))).sort();

  const networkSelect = document.getElementById("networkFilter");
  const currentValues = Array.from(networkSelect.selectedOptions).map(o => o.value);

  networkSelect.innerHTML = "";

  uniqueNetworks.forEach(net => {
    const opt = document.createElement("option");
    opt.value = net;
    opt.textContent = net;
    networkSelect.appendChild(opt);
  });

  currentValues.forEach(v => {
    if (uniqueNetworks.includes(v)) {
      networkSelect.querySelector(`option[value="${v}"]`).selected = true;
    }
  });
}

function updateTimeSlicer(filteredData) {
  const uniqueTimes = Array.from(new Set(filteredData.map(d => d.Start_Time)))
                           .sort((a, b) => new Date("1970/01/01 " + a) - new Date("1970/01/01 " + b));

  const timeSelect = document.getElementById("timeFilter");
  const currentValue = timeSelect.value;

  timeSelect.innerHTML = "";

  uniqueTimes.forEach(time => {
    const opt = document.createElement("option");
    opt.value = time;
    opt.textContent = time;
    timeSelect.appendChild(opt);
  });

  if (uniqueTimes.includes(currentValue)) {
    timeSelect.value = currentValue;
  }
}

document.getElementById("dateFilter").addEventListener("change", applyFilters);
document.getElementById("networkFilter").addEventListener("change", applyFilters);
document.getElementById("timeFilter").addEventListener("change", applyFilters);
    
  // Keep data available globally for later steps
  window.gameData = data;
  });
</script>

</body>
</html>
