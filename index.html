<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Football Broadcast Dashboard</title>

  <!-- External Stylesheets -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Internal Custom Styling -->
  <style>
    /* Global Reset and Layout */
    html, body {
      height: 100%;
      margin: 0;
      background-color: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Outer Dashboard Layout Wrapper */
    .main-wrapper {
      min-height: 96vh;
      display: flex;
      flex-direction: column;
    }

    /* Control Panel Card Styling */
    .filter-panel {
      background-color: #fff;
      border-radius: 8px;
      padding: 1.25rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      height: 100%;
    }

    /* Main Gantt Chart Wrapper - Container scrolls if chart exceeds screen */
    .chart-container {
      background-color: #fff;
      border-radius: 8px;
      padding: 1.25rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      min-height: 96vh;
      max-height: 96vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* Plotly Chart Mount Target */
    #barChart {
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- Application Layout Root -->
  <div class="container-fluid px-4 py-3 main-wrapper">
    <div class="row g-3 flex-grow-1">

      <!-- Sidebar Controls Section -->
      <div class="col-md-2">
        <div class="filter-panel">
          <h5 class="mb-3">Week 2 Selections</h5>

          <!-- Single-Select Date Slicer -->
          <div class="mb-3">
            <label for="dateFilter" class="form-label">Day/Date</label>
            <select id="dateFilter" class="form-select"></select>
          </div>

          <!-- Multi-Select Network Slicer -->
          <div class="mb-3">
            <label for="networkFilter" class="form-label">Media Provider</label>
            <select id="networkFilter" class="form-select" multiple size="8"></select>
          </div>

          <!-- Single-Select Kickoff Time Filter -->
          <div class="mb-3">
            <label for="timeFilter" class="form-label">Kickoff Time</label>
            <select id="timeFilter" class="form-select"></select>
          </div>

          <!-- Single-Select Ranked Matchup Filter -->
          <div class="mb-3">
            <label for="rankedFilter" class="form-label">Ranked Teams</label>
            <select id="rankedFilter" class="form-select"></select>
          </div>
        </div>
      </div>

      <!-- Main Dashboard Visualization Display -->
      <div class="col-md-10">
        <div class="chart-container">
          <h5 class="mb-2">College Football Guide (all times Central Time)</h5>
          <div id="barChart"></div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

      // Independent & Other
      "Notre Dame": "#0C2340",

    // ==========================================
    // 2. DATA INITIALIZATION & EVENT LISTENERS
    // ==========================================

    // Fetch game dataset via D3, sanitizing UTF-8 BOM characters from CSV headers
    d3.csv("02_weekFull.csv", raw => {
      const clean = {};
      Object.keys(raw).forEach(key => {
        const normalizedKey = key.replace(/^\uFEFF/, "");
        clean[normalizedKey] = raw[key];
      });
      return clean;
    }).then(data => {
      // Store globally for cascading filter lookup
      window.gameData = data;

      // Seed initial controls and render view
      const initialDate = getFirstAvailableDate(window.gameData);
      updateDateSlicer(window.gameData, initialDate);
      updateCascadingFilters();
      applyFilters();

      // Control Event Listeners
      document.getElementById("dateFilter").addEventListener("change", () => {
        updateCascadingFilters();
        applyFilters();
      });
      
      document.getElementById("networkFilter").addEventListener("change", applyFilters);
      document.getElementById("timeFilter").addEventListener("change", applyFilters);
      document.getElementById("rankedFilter").addEventListener("change", applyFilters);
    });

    // ==========================================
    // 3. FILTER & SLICER MANAGEMENT FUNCTIONS
    // ==========================================

    /**
     * Finds chronologically earliest date in the dataset
     */
    function getFirstAvailableDate(allData) {
      const uniqueDates = Array.from(new Set(allData.map(d => d.Date)))
        .filter(Boolean)
        .sort((a, b) => new Date(a) - new Date(b));
      return uniqueDates[0] || null;
    }

    /**
     * Populates primary Date dropdown control
     */
    function updateDateSlicer(allData, selectedDate) {
      const uniqueDates = Array.from(new Set(allData.map(d => d.Date)))
        .filter(Boolean)
        .sort((a, b) => new Date(a) - new Date(b));

      const dateSelect = document.getElementById("dateFilter");
      dateSelect.innerHTML = "";

      uniqueDates.forEach(date => {
        const opt = document.createElement("option");
        opt.value = date;
        opt.textContent = date;
        dateSelect.appendChild(opt);
      });

      if (selectedDate && uniqueDates.includes(selectedDate)) {
        dateSelect.value = selectedDate;
      } else if (uniqueDates.length > 0) {
        dateSelect.value = uniqueDates[0];
      }
    }

    /**
     * Updates dependent filters (Network, Time & Ranked Matchups) based on current Date selection
     */
    function updateCascadingFilters() {
      const selectedDate = document.getElementById("dateFilter").value;
      const dateFiltered = window.gameData.filter(d => d.Date === selectedDate);

      const currentNetworks = Array.from(
        document.getElementById("networkFilter").selectedOptions
      ).map(o => o.value);
      const currentTime = document.getElementById("timeFilter").value;
      const currentRanked = document.getElementById("rankedFilter").value;

      updateNetworkSlicer(dateFiltered, currentNetworks);
      updateTimeSlicer(dateFiltered, currentTime);
      updateRankedSlicer(dateFiltered, currentRanked);
    }

    /**
     * Populates multiselect network list for selected date
     */
    function updateNetworkSlicer(filteredData, selectedNetworks) {
      const uniqueNetworks = Array.from(new Set(filteredData.map(d => d.TV_Network)))
        .filter(Boolean)
        .sort();
        
      const networkSelect = document.getElementById("networkFilter");
      networkSelect.innerHTML = "";

      uniqueNetworks.forEach(net => {
        const opt = document.createElement("option");
        opt.value = net;
        opt.textContent = net;
        if (selectedNetworks.includes(net)) {
          opt.selected = true;
        }
        networkSelect.appendChild(opt);
      });
    }

    /**
     * Populates Kickoff Time dropdown for selected date
     */
    function updateTimeSlicer(filteredData, selectedTime) {
      const uniqueTimes = Array.from(new Set(filteredData.map(d => d.Start_Time)))
        .filter(Boolean)
        .sort((a, b) => new Date("1970/01/01 " + a) - new Date("1970/01/01 " + b));

      const timeSelect = document.getElementById("timeFilter");
      timeSelect.innerHTML = '<option value="All">All Times</option>';

      uniqueTimes.forEach(time => {
        const opt = document.createElement("option");
        opt.value = time;
        opt.textContent = time;
        timeSelect.appendChild(opt);
      });

      if (selectedTime && (uniqueTimes.includes(selectedTime) || selectedTime === "All")) {
        timeSelect.value = selectedTime;
      } else {
        timeSelect.value = "All";
      }
    }

    /**
     * Populates Ranked Matchup dropdown for selected date
     */
    function updateRankedSlicer(filteredData, selectedRanked) {
      const rankedSelect = document.getElementById("rankedFilter");
      rankedSelect.innerHTML = `
        <option value="All">All Games</option>
        <option value="Y">Top 25</option>
      `;

      if (selectedRanked === "Y" || selectedRanked === "All") {
        rankedSelect.value = selectedRanked;
      } else {
        rankedSelect.value = "All";
      }
    }

    /**
     * Filters global dataset against active selection states and invokes chart draw
     */
    function applyFilters() {
      const selectedDate = document.getElementById("dateFilter").value;
      const networkSelect = document.getElementById("networkFilter");
      const selectedNetworks = Array.from(networkSelect.selectedOptions).map(o => o.value);
      const selectedTime = document.getElementById("timeFilter").value;
      const selectedRanked = document.getElementById("rankedFilter").value;

      let filtered = window.gameData.filter(d => d.Date === selectedDate);

      if (selectedNetworks.length > 0) {
        filtered = filtered.filter(d => selectedNetworks.includes(d.TV_Network));
      }

      if (selectedTime && selectedTime !== "All") {
        filtered = filtered.filter(d => d.Start_Time === selectedTime);
      }

      if (selectedRanked && selectedRanked === "Y") {
        filtered = filtered.filter(d => d.Top_25 === "Y");
      }

      renderChart(filtered);
    }

    // ==========================================
    // 4. UTILITY HELPER FUNCTIONS
    // ==========================================

    /**
     * Extracts home team from string title ("Away at Home") and resolves team hex color
     */
    function getHomeTeamColor(matchup) {
      if (!matchup) return '#D3D3D3';

      const parts = matchup.split(/\s+(?:at|vs\.?)\s+/i);
      if (parts.length < 2) return '#0d6efd';

      let homeTeamRaw = parts[parts.length - 1].trim();

      // Strip national rankings (e.g., "No. 16 ", "No. 1 ", "#5 ")
      let homeTeam = homeTeamRaw.replace(/^(?:No\.\s*\d+|#\d+)\s+/i, '').trim();

      // Strip neutral-site bracket labels (e.g., "(Mercedes-Benz Stadium)")
      homeTeam = homeTeam.replace(/\s*\([^)]*\)/g, '').trim();

      return TEAM_COLORS[homeTeam] || '#D3D3D3';
    }

    /**
     * Converts "HH:MM AM/PM" time strings into total minutes from midnight for charting
     */
    function timeToMinutes(t) {
      if (!t) return 0;
      const [time, ampm] = t.split(' ');
      let [h, m] = time.split(':').map(Number);
      if (ampm === 'PM' && h !== 12) h += 12;
      if (ampm === 'AM' && h === 12) h = 0;
      return h * 60 + m;
    }

    // ==========================================
    // 5. CHART RENDER ENGINE (Plotly)
    // ==========================================

    /**
     * Constructs and mounts horizontal Gantt timeline using Plotly stacked bars
     */
    function renderChart(data) {
      const container = document.getElementById('barChart');

      // Empty state handler
      if (!data || data.length === 0) {
        container.style.height = '96vh';
        Plotly.newPlot('barChart', [], {
          title: 'No ranked teams per user selections.',
          xaxis: { visible: false },
          yaxis: { visible: false },
          showlegend: false
        });
        return;
      }

      // Group games by network channel row
      const grouped = d3.group(data, d => d.TV_Network);
      const traces = [];

      // Track unique Y-axis row labels to calculate chart height dynamically
      const uniqueYLabels = new Set();

      grouped.forEach((games, network) => {
        uniqueYLabels.add(network);

        // Sort chronologically within row
        games.sort((a, b) => timeToMinutes(a.Start_Time) - timeToMinutes(b.Start_Time));

        games.forEach(game => {
          const start = timeToMinutes(game.Start_Time);
          const end = timeToMinutes(game.End_Time);
          
          // Compute window length, supporting midnight turnover wrapped games
          const duration = end >= start ? (end - start) : (end + 1440 - start);
          const teamHexColor = getHomeTeamColor(game.Matchup);

          // Build individual Plotly horizontal bar segment
          traces.push({
            type: 'bar',
            orientation: 'h',
            y: [network],
            x: [duration],
            base: [start],
            name: game.Matchup,
            marker: { 
              color: teamHexColor,
              line: { color: '#ffffff', width: 1.5 }
            },
            text: [game.Matchup],
            textposition: 'inside',
            insidetextanchor: 'middle',
            insidetextfont: {
              family: 'Segoe UI, Arial, sans-serif'
            },
            hovertemplate:
              '<b>%{text}</b><br>' +
              'Network: ' + network + '<br>' +
              'Kickoff: %{customdata[0]}<br>' +
              'End: %{customdata[1]}<extra></extra>',
            customdata: [[game.Start_Time, game.End_Time]]
          });
        });
      });

      // FIXED BAR HEIGHT CALCULATIONS
      const ROW_HEIGHT = 29; // Pixel height assigned to each network row
      const PADDING = 100;    // Top and bottom margin padding for axes & labels
      const calculatedHeight = (uniqueYLabels.size * ROW_HEIGHT) + PADDING;

      // Update container element height
      container.style.height = `${calculatedHeight}px`;

      // Chart layout configurations
      const layout = {
        barmode: 'stack',
        bargap: 0.1, // Preserves proportional gap between rows so bars retain thickness
        autosize: true,
        height: calculatedHeight,
        xaxis: {
          side: 'top',
          tickmode: 'array',
          // 15-minute minute offset marks from 11:00 AM to 12:00 AM
          tickvals: [660, 720, 780, 840, 900, 960, 1020, 1080, 1140, 1200, 1260, 1320, 1380, 1440],
          ticktext: [
            '11:00 AM', '12:00 PM', '1:00 PM', '2:00 PM', '3:00 PM', '4:00 PM', 
            '5:00 PM', '6:00 PM', '7:00 PM', '8:00 PM', '9:00 PM', '10:00 PM', '11:00 PM', '12:00 AM'
          ],
          tickangle: -30,
          tickfont: {
            family: 'Segoe UI, Arial, sans-serif',
            size: 10
          }
        },
        yaxis: { 
          automargin: true,
          autorange: 'reversed',
          tickfont: {
            family: 'Segoe UI, Arial, sans-serif'
          } 
        },
        margin: { l: 120, r: 40, t: 50, b: 30 },
        showlegend: false
      };

      // Draw plot and ensure responsive layout sizing
      Plotly.newPlot('barChart', traces, layout, { responsive: true }).then(() => {
        Plotly.Plots.resize('barChart');
      });
    }

    // Window Resize Handler
    window.addEventListener('resize', () => {
      Plotly.Plots.resize('barChart');
    });
  </script>
