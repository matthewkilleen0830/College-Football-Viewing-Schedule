<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Football Broadcast Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .filter-panel {
      background-color: #fff;
      border-radius: 8px;
      padding: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .chart-container {
      background-color: #fff;
      border-radius: 8px;
      padding: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      height: 70vh;
    }
  </style>
</head>
<body>
  <div class="container-fluid mt-4">
    <div class="row mb-3">
      <div class="col-md-3 filter-panel">
        <h5 class="mb-3">Filters</h5>
        <div class="mb-3">
          <label for="dateFilter" class="form-label">Day / Date</label>
          <select id="dateFilter" class="form-select"></select>
        </div>
        <div class="mb-3">
          <label for="networkFilter" class="form-label">TV Network</label>
          <select id="networkFilter" class="form-select" multiple></select>
        </div>
        <div class="mb-3">
          <label for="timeFilter" class="form-label">Kickoff Time (Eastern)</label>
          <select id="timeFilter" class="form-select"></select>
        </div>
      </div>

      <div class="col-md-9">
        <div class="chart-container">
          <h5 class="mb-3">Game Duration by TV Network and Matchup</h5>
          <div id="barChart"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    // Placeholder for loading CSV and rendering chart
    d3.csv("01_weekFull.csv").then(data => {
      console.log(data);
      // TODO: populate filters and render timeline-style bars
    });
  </script>
</body>
</html>
