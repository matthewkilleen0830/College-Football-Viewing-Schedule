<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Football Broadcast Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .filter-panel {
      background-color: #fff;
      border-radius: 8px;
      padding: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .chart-container {
      background-color: #fff;
      border-radius: 8px;
      padding: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      height: 70vh;
    }
  </style>
</head>
<body>
  <div class="container-fluid mt-4">
    <div class="row mb-3">
      <div class="col-md-3 filter-panel">
        <h5 class="mb-3">Filters</h5>
        <div class="mb-3">
          <label for="dateFilter" class="form-label">Date</label>
          <select id="dateFilter" class="form-select"></select>
        </div>
        <div class="mb-3">
          <label for="networkFilter" class="form-label">TV Provider</label>
          <select id="networkFilter" class="form-select" multiple></select>
        </div>
        <div class="mb-3">
          <label for="timeFilter" class="form-label">Kickoff Time (Eastern)</label>
          <select id="timeFilter" class="form-select"></select>
        </div>
      </div>

      <div class="col-md-9">
        <div class="chart-container">
          <h5 class="mb-3">College Football Guide</h5>
          <div id="barChart"></div>
        </div>
      </div>
    </div>
  </div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<script>
  d3.csv("01_weekFull.csv").then(data => {
    // 1. Get unique dates from the dataset
    const uniqueDates = Array.from(new Set(data.map(d => d.Date)));

    // 2. Sort dates (optional, but usually helpful)
    uniqueDates.sort((a, b) => new Date(a) - new Date(b));

    // 3. Populate the Day / Date filter
    const dateSelect = document.getElementById("dateFilter");
    dateSelect.innerHTML = ""; // clear any existing options

    uniqueDates.forEach(date => {
    const opt = document.createElement("option");
    opt.value = date;
    opt.textContent = date;
    dateSelect.appendChild(opt);
  });
      
    // 1. Get unique TV Networks
    const uniqueNetworks = Array.from(new Set(data.map(d => d.TV_Network)));

    // 2. Sort alphabetically
    uniqueNetworks.sort();

    // 3. Populate the TV Network filter
    const networkSelect = document.getElementById("networkFilter");
    networkSelect.innerHTML = ""; // clear existing options

    uniqueNetworks.forEach(net => {
    const opt = document.createElement("option");
    opt.value = net;
    opt.textContent = net;
    networkSelect.appendChild(opt);

  });

  // 1. Get unique kickoff times
  const uniqueTimes = Array.from(new Set(data.map(d => d.Start_Time)));

  // 2. Sort times chronologically
  uniqueTimes.sort((a, b) => {
  // Convert "6:00 PM" → Date object for sorting
  return new Date("1970/01/01 " + a) - new Date("1970/01/01 " + b);
  });

  // 3. Populate the Kickoff Time filter
  const timeSelect = document.getElementById("timeFilter");
  timeSelect.innerHTML = ""; // clear existing options

  uniqueTimes.forEach(time => {
  const opt = document.createElement("option");
  opt.value = time;
  opt.textContent = time;
  timeSelect.appendChild(opt);
  });

    
  // Keep data available globally for later steps
  window.gameData = data;
  });
</script>

</body>
</html>
