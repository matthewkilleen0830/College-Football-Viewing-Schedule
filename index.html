<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Football Broadcast Dashboard</title>

  <!-- External Stylesheets -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="styles.css">

  <style>
    /* Custom CSS to make the checkbox panel scrollable and match Bootstrap styling */
    .checkbox-panel {
      max-height: 200px;
      overflow-y: auto;
      background-color: #fff;
      border: 1px solid #dee2e6;
      border-radius: 0.375rem;
      padding: 0.5rem 0.75rem;
    }
    .checkbox-panel .form-check {
      margin-bottom: 0.25rem;
    }
    .checkbox-panel .form-check:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>

  <!-- Application Layout Root -->
  <div class="container-fluid px-4 py-3 main-wrapper">
    <div class="row g-3 flex-grow-1">

      <!-- Sidebar Controls Section -->
      <div class="col-md-2 align-self-start">
        <div class="filter-panel">
          <h5 class="mb-3">Week 2 Selections</h5>

          <!-- Single-Select Date Slicer -->
          <div class="mb-3">
            <label for="dateFilter" class="form-label">Day/Date</label>
            <select id="dateFilter" class="form-select"></select>
          </div>

          <!-- Multi-Select Checkbox Network Slicer -->
          <div class="mb-3">
            <label class="form-label">Media Provider</label>
            <div id="networkFilter" class="checkbox-panel">
              <!-- Checkboxes dynamically rendered via JavaScript -->
            </div>
          </div>

          <!-- Single-Select Kickoff Time Filter -->
          <div class="mb-3">
            <label for="timeFilter" class="form-label">Kickoff Time</label>
            <select id="timeFilter" class="form-select"></select>
          </div>

          <!-- Single-Select Ranked Matchup Filter -->
          <div class="mb-3">
            <label for="rankedFilter" class="form-label">Ranked Teams</label>
            <select id="rankedFilter" class="form-select"></select>
          </div>
        </div>
      </div>

      <!-- Main Dashboard Visualization Display -->
      <div class="col-md-10 d-flex flex-column gap-3">
        
        <!-- Primary Broadcast Networks Chart Container -->
        <div class="chart-container">
          <h5 class="mb-2">College Football Guide (all times Central Time)</h5>
          <div id="barChart" class="plotly-chart"></div>
        </div>

        <!-- Digital / Plus Streaming Networks Chart Container -->
        <div class="chart-container" id="digitalChartContainer">
          <h5 class="mb-2">Digital & Streaming Networks (ESPN+, MW+, SECN+)</h5>
          <div id="digitalChart" class="plotly-chart"></div>
        </div>

      </div>

    </div>
  </div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

    // ==========================================
    // 2. DATA INITIALIZATION & EVENT LISTENERS
    // ==========================================

    d3.csv("02_weekFull.csv", raw => {
      const clean = {};
      Object.keys(raw).forEach(key => {
        const normalizedKey = key.replace(/^\uFEFF/, "");
        clean[normalizedKey] = raw[key];
      });
      return clean;
    }).then(data => {
      window.gameData = data;

      const initialDate = getFirstAvailableDate(window.gameData);
      updateDateSlicer(window.gameData, initialDate);
      updateCascadingFilters();
      applyFilters();

      document.getElementById("dateFilter").addEventListener("change", () => {
        updateCascadingFilters();
        applyFilters();
      });
      
      document.getElementById("timeFilter").addEventListener("change", applyFilters);
      document.getElementById("rankedFilter").addEventListener("change", applyFilters);
    });

    // ==========================================
    // 3. FILTER & SLICER MANAGEMENT FUNCTIONS
    // ==========================================

    function getFirstAvailableDate(allData) {
      const uniqueDates = Array.from(new Set(allData.map(d => d.Date)))
        .filter(Boolean)
        .sort((a, b) => new Date(a) - new Date(b));
      return uniqueDates[0] || null;
    }

    function updateDateSlicer(allData, selectedDate) {
      const uniqueDates = Array.from(new Set(allData.map(d => d.Date)))
        .filter(Boolean)
        .sort((a, b) => new Date(a) - new Date(b));

      const dateSelect = document.getElementById("dateFilter");
      dateSelect.innerHTML = "";

      uniqueDates.forEach(date => {
        const opt = document.createElement("option");
        opt.value = date;
        opt.textContent = date;
        dateSelect.appendChild(opt);
      });

      if (selectedDate && uniqueDates.includes(selectedDate)) {
        dateSelect.value = selectedDate;
      } else if (uniqueDates.length > 0) {
        dateSelect.value = uniqueDates[0];
      }
    }

    function updateCascadingFilters() {
  const selectedDate = document.getElementById("dateFilter").value;
  const dateFiltered = window.gameData.filter(d => d.Date === selectedDate);

  // Check if "All Providers" master toggle is currently checked
  const allCheckbox = document.getElementById("net_all");
  const wasAllChecked = allCheckbox ? allCheckbox.checked : true;

  let checkedBoxes = [];
  if (!wasAllChecked) {
    // Only capture specific selections if "All Providers" was NOT selected
    checkedBoxes = Array.from(
      document.querySelectorAll("#networkFilter .network-checkbox:checked")
    ).map(cb => cb.value);
  }

  const currentTime = document.getElementById("timeFilter").value;
  const currentRanked = document.getElementById("rankedFilter").value;

  // Passing [] when "All Providers" was checked forces all new date's networks to stay checked
  updateNetworkSlicer(dateFiltered, checkedBoxes);
  updateTimeSlicer(dateFiltered, currentTime);
  updateRankedSlicer(dateFiltered, currentRanked);
}

    function updateNetworkSlicer(filteredData, selectedNetworks) {
      const uniqueNetworks = Array.from(new Set(filteredData.map(d => d.TV_Network)))
        .filter(Boolean)
        .sort();
        
      const container = document.getElementById("networkFilter");
      container.innerHTML = "";

      // Determine if "All Providers" should start checked (default on initial render or if all are checked)
      const isAllChecked = selectedNetworks.length === 0 || uniqueNetworks.every(net => selectedNetworks.includes(net));

      // 1. Create "All Providers" Master Toggle
      const allDiv = document.createElement("div");
      allDiv.className = "form-check border-bottom pb-1 mb-2";
      allDiv.innerHTML = `
        <input class="form-check-input" type="checkbox" id="net_all" ${isAllChecked ? 'checked' : ''}>
        <label class="form-check-label fw-bold" for="net_all">All Providers</label>
      `;
      container.appendChild(allDiv);

      // 2. Create individual network checkboxes
      uniqueNetworks.forEach((net, idx) => {
        const isChecked = isAllChecked || selectedNetworks.includes(net);
        const div = document.createElement("div");
        div.className = "form-check";
        div.innerHTML = `
          <input class="form-check-input network-checkbox" type="checkbox" value="${net}" id="net_${idx}" ${isChecked ? 'checked' : ''}>
          <label class="form-check-label" for="net_${idx}">${net}</label>
        `;
        container.appendChild(div);
      });

      // 3. Setup event handler for "All Providers" master checkbox
      const allCheckbox = document.getElementById("net_all");
      const itemCheckboxes = container.querySelectorAll(".network-checkbox");

      allCheckbox.addEventListener("change", (e) => {
        itemCheckboxes.forEach(cb => cb.checked = e.target.checked);
        applyFilters();
      });

      // 4. Setup event handlers for individual network checkboxes
      itemCheckboxes.forEach(cb => {
        cb.addEventListener("change", () => {
          const allChecked = Array.from(itemCheckboxes).every(item => item.checked);
          allCheckbox.checked = allChecked;
          applyFilters();
        });
      });
    }

    function updateTimeSlicer(filteredData, selectedTime) {
      const uniqueTimes = Array.from(new Set(filteredData.map(d => d.Start_Time)))
        .filter(Boolean)
        .sort((a, b) => new Date("1970/01/01 " + a) - new Date("1970/01/01 " + b));

      const timeSelect = document.getElementById("timeFilter");
      timeSelect.innerHTML = '<option value="All">All Times</option>';

      uniqueTimes.forEach(time => {
        const opt = document.createElement("option");
        opt.value = time;
        opt.textContent = time;
        timeSelect.appendChild(opt);
      });

      if (selectedTime && (uniqueTimes.includes(selectedTime) || selectedTime === "All")) {
        timeSelect.value = selectedTime;
      } else {
        timeSelect.value = "All";
      }
    }

    function updateRankedSlicer(filteredData, selectedRanked) {
      const rankedSelect = document.getElementById("rankedFilter");
      rankedSelect.innerHTML = `
        <option value="All">All Games</option>
        <option value="Y">AP Top 25</option>
      `;

      if (selectedRanked === "Y" || selectedRanked === "All") {
        rankedSelect.value = selectedRanked;
      } else {
        rankedSelect.value = "All";
      }
    }

    function applyFilters() {
      const selectedDate = document.getElementById("dateFilter").value;
      
      // Get all checked network values
      const checkedBoxes = Array.from(
        document.querySelectorAll("#networkFilter .network-checkbox:checked")
      ).map(cb => cb.value);
      
      const selectedTime = document.getElementById("timeFilter").value;
      const selectedRanked = document.getElementById("rankedFilter").value;

      let filtered = window.gameData.filter(d => d.Date === selectedDate);

      // Filter by checked networks
      filtered = filtered.filter(d => checkedBoxes.includes(d.TV_Network));

      if (selectedTime && selectedTime !== "All") {
        filtered = filtered.filter(d => d.Start_Time === selectedTime);
      }

      if (selectedRanked && selectedRanked === "Y") {
        filtered = filtered.filter(d => d.Top_25 === "Y");
      }

      const primaryData = filtered.filter(d => !DIGITAL_NETWORKS.includes(d.TV_Network));
      const digitalData = filtered.filter(d => DIGITAL_NETWORKS.includes(d.TV_Network));

      renderChart('barChart', primaryData, false);
      renderChart('digitalChart', digitalData, true);
    }

    // ==========================================
    // 4. UTILITY HELPER FUNCTIONS
    // ==========================================

    function getHomeTeamColor(matchup) {
      if (!matchup) return '#D3D3D3';

      const parts = matchup.split(/\s+(?:at|vs\.?)\s+/i);
      if (parts.length < 2) return '#0d6efd';

      let homeTeamRaw = parts[parts.length - 1].trim();

      let homeTeam = homeTeamRaw.replace(/^(?:No\.\s*\d+|#\d+)\s+/i, '').trim();
      homeTeam = homeTeam.replace(/\s*\([^)]*\)/g, '').trim();

      return TEAM_COLORS[homeTeam] || '#D3D3D3';
    }

    function timeToMinutes(t) {
      if (!t) return 0;
      const [time, ampm] = t.split(' ');
      let [h, m] = time.split(':').map(Number);
      if (ampm === 'PM' && h !== 12) h += 12;
      if (ampm === 'AM' && h === 12) h = 0;
      return h * 60 + m;
    }

    function resolveOverlapSubRows(games) {
      games.sort((a, b) => timeToMinutes(a.Start_Time) - timeToMinutes(b.Start_Time));

      const subRowEndTimes = [];
      const assignedGames = [];

      games.forEach(game => {
        const start = timeToMinutes(game.Start_Time);
        const end = timeToMinutes(game.End_Time);
        const effectiveEnd = end >= start ? end : end + 1440;

        let rowIndex = -1;
        for (let i = 0; i < subRowEndTimes.length; i++) {
          if (subRowEndTimes[i] <= start) {
            rowIndex = i;
            break;
          }
        }

        if (rowIndex === -1) {
          subRowEndTimes.push(effectiveEnd);
          rowIndex = subRowEndTimes.length - 1;
        } else {
          subRowEndTimes[rowIndex] = effectiveEnd;
        }

        assignedGames.push({
          ...game,
          subRowIndex: rowIndex
        });
      });

      return { assignedGames, totalSubRows: subRowEndTimes.length };
    }

    // ==========================================
    // 5. CHART RENDER ENGINE (Plotly)
    // ==========================================

    function renderChart(targetId, data, isDigital = false) {
      const container = document.getElementById(targetId);

      if (!data || data.length === 0) {
        container.style.height = '120px';
        Plotly.newPlot(targetId, [], {
          title: {
            text: isDigital ? 'No Digital/Streaming games matching user selection.' : 'No games matching user selection.',
            font: { size: 14 }
          },
          xaxis: { visible: false },
          yaxis: { visible: false },
          showlegend: false
        }, { responsive: true, displayModeBar: false });
        return;
      }

      const grouped = d3.group(data, d => d.TV_Network);
      const traces = [];
      const yTicks = []; // Stores unique internal row keys
      const yTickLabels = []; // Stores the display label (clean network name)

      grouped.forEach((games, network) => {
        const { assignedGames, totalSubRows } = resolveOverlapSubRows(games);

        // Pre-create internal unique keys and display text for all sub-rows of this network
        for (let i = 0; i < totalSubRows; i++) {
          const rowKey = `${network}_row_${i}`;
          yTicks.push(rowKey);
          yTickLabels.push(network); // All rows for this provider map to just "ESPN+", "MW+", etc.
        }

        assignedGames.forEach(game => {
          const start = timeToMinutes(game.Start_Time);
          const end = timeToMinutes(game.End_Time);
          const duration = end >= start ? (end - start) : (end + 1440 - start);
          const teamHexColor = getHomeTeamColor(game.Matchup);

          const internalRowKey = `${network}_row_${game.subRowIndex}`;

          traces.push({
            type: 'bar',
            orientation: 'h',
            y: [internalRowKey],
            x: [duration],
            base: [start],
            name: game.Matchup,
            marker: { 
              color: teamHexColor,
              line: { color: '#ffffff', width: 1.5 }
            },
            text: [game.Matchup],
            textposition: 'inside',
            insidetextanchor: 'middle',
            insidetextfont: {
              family: 'Segoe UI, Arial, sans-serif'
            },
            hovertemplate:
              '<b>%{text}</b><br>' +
              'Network: ' + network + '<br>' +
              'Kickoff: %{customdata[0]}<br>' +
              'End: %{customdata[1]}<extra></extra>',
            customdata: [[game.Start_Time, game.End_Time]]
          });
        });
      });

      const ROW_HEIGHT = 30;
      const PADDING = 90;
      const calculatedHeight = Math.max((yTicks.length * ROW_HEIGHT) + PADDING, 140);

      container.style.height = `${calculatedHeight}px`;

      const layout = {
        barmode: 'stack',
        bargap: 0.15,
        autosize: true,
        height: 30,
        margin: { l: 91, r: 15, t: 50, b: 20 },
        xaxis: {
          side: 'top',
          type: 'linear',
          range: [660, 1500],
          tickmode: 'array',
          tickvals: SHARED_X_AXIS_VALS,
          ticktext: SHARED_X_AXIS_TEXT,
          tickangle: -30,
          tickfont: {
            family: 'Segoe UI, Arial, sans-serif',
            size: 10
          },
          showgrid: true,
          gridcolor: '#e9ecef',
          autorange: false,
          automargin: false
        },
        yaxis: { 
          autorange: 'reversed',
          tickmode: 'array',
          tickvals: yTicks,       // Internal unique row keys
          ticktext: yTickLabels, // Display text (e.g. "ESPN+", "MW+", "SECN+")
          tickfont: {
            family: 'Segoe UI, Arial, sans-serif'
          },
          automargin: false
        },
        showlegend: false
      };

      const config = {
        responsive: true,
        displayModeBar: false
      };

      Plotly.newPlot(targetId, traces, layout, config).then(() => {
        Plotly.Plots.resize(targetId);
      });
    }

    // Trigger Plotly responsive redrawing on window resize
    window.addEventListener('resize', () => {
      Plotly.Plots.resize('barChart');
      Plotly.Plots.resize('digitalChart');
    });
  </script>
</body>
</html>
